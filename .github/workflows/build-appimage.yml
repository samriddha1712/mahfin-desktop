name: build-appimage

on:
  workflow_call:
  workflow_dispatch:

# One run per workflow per branch. A new push cancels the run it supersedes
# rather than queueing behind it — without this, pushing three times meant three
# full matrices competing for the same scarce macOS runners, and the newest
# build (the one anyone actually wants) waited behind two obsolete ones.
concurrency:
  group: build-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build AppImage
      env:
        WORKSPACE: ${{ github.workspace }}
      run: |
        docker build \
          -t mahfin-desktop-appimage \
          -f dev/appimage/Dockerfile \
          .
        mkdir -p output
        docker run --rm \
          -v "${WORKSPACE}/output:/host-output" \
          mahfin-desktop-appimage
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: linux-appimage-x86_64
        path: ${{ github.workspace }}/output/MahfinDesktop-*.AppImage
