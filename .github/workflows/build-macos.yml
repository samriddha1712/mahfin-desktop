name: build-macos

on:
  workflow_call:
  workflow_dispatch:

# One run per workflow per branch. A new push cancels the run it supersedes
# rather than queueing behind it — without this, pushing three times meant three
# full matrices competing for the same scarce macOS runners, and the newest
# build (the one anyone actually wants) waited behind two obsolete ones.
concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: macos-arm64
          - runner: macos-15-intel
            artifact: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        # using older version due to severe memory leak
        # https://qt-project.atlassian.net/browse/QTBUG-141377https://qt-project.atlassian.net/browse/QTBUG-141377
        #version: '6.10.1'
        version: '6.9.3'
        arch: clang_64
        modules: 'qtwebengine qtwebchannel qtpositioning'
    - name: Install dependencies
      run: |
        brew install mpv
    - name: Release build
      run: |
        cmake -B build -G Ninja \
          -DQTROOT=$QT_ROOT_DIR \
          -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=build/output \
          -DCHECK_FOR_UPDATES=ON \
          -DUSE_STATIC_MPVQT=ON
        cmake --build build --target install
    - name: Sign and create dmg
      run: |
        APP="./build/output/Mahfin.app"

        # Sign from the inside out, and not with --deep.
        #
        # This is hygiene, not the cure for a Mac refusing to open the app.
        # That refusal is Gatekeeper declining an ad-hoc signature it cannot
        # trace to a developer account, and no amount of correct ad-hoc signing
        # changes it -- only notarisation does.
        #
        # --deep is nonetheless deprecated by Apple for signing, and does not
        # treat a nested .app as a bundle in its own right -- and this one
        # carries QtWebEngineCore.framework/Helpers/QtWebEngineProcess.app. It
        # has been producing something macOS accepts, but nothing here checked
        # that, so there was no way to learn if it ever stopped.
        #
        # Order matters: anything that contains other code has to be signed
        # after the code it contains, or sealing the container invalidates what
        # is inside it.
        find "$APP/Contents" -type f \( -name '*.dylib' -o -name '*.so' \) -exec codesign --force -s - {} +
        find "$APP/Contents" -type d -name '*.app' -exec codesign --force -s - {} +
        find "$APP/Contents" -type d -name '*.framework' -exec codesign --force -s - {} +
        codesign --force -s - "$APP"

        # Fail the build rather than publish a disk image nobody can open.
        # Nothing checked this before, so the first sign of a bad seal would
        # have been somebody unable to open the app.
        codesign --verify --deep --strict --verbose=2 "$APP"

        brew install create-dmg
        # The tag that cut the release names the file, with the VERSION file as
        # the fallback for a branch build -- the same rule VersionConfiguration
        # .cmake applies to the app itself. The dmg was the last artifact still
        # named from the file alone, so it could drift from the tag again even
        # after the app stopped doing so.
        VERSION=$(cat VERSION)
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          TAG_VERSION=$(printf '%s' "$GITHUB_REF_NAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -n "$TAG_VERSION" ]; then
            VERSION="$TAG_VERSION"
          else
            echo "::warning::Tag '$GITHUB_REF_NAME' carries no version number; naming the dmg $VERSION from the VERSION file"
          fi
        fi
        ARCH=$(uname -m)
        DMG_NAME="Mahfin-${VERSION}-${ARCH}.dmg"
        # --eula is the only thing the Finder shows on its own when a disk
        # image is opened. The app is ad-hoc signed, so its first launch is
        # refused, and the way past that is four steps deep in System Settings
        # — nobody finds it by accident and a README in the window goes unread.
        create-dmg \
          --volname "Mahfin v${VERSION}" \
          --eula bundle/osx/first-launch.txt \
          --no-internet-enable \
          --background bundle/osx/dmg-background.tiff \
          --window-size 700 520 \
          --icon-size 100 \
          --icon "Mahfin.app" 170 195 \
          --app-drop-link 530 195 \
          "${DMG_NAME}" "./build/output/Mahfin.app"
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: ${{ github.workspace }}/Mahfin-*.dmg
